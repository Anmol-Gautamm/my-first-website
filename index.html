<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">FLAPPY BIRD</h1>
        </header>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="480" height="680"></canvas>
            
            <!-- Difficulty Selector Overlay -->
            <div id="difficultyOverlay" class="difficulty-overlay">
                <div class="diff-title">DIFFICULTY</div>
                <div class="diff-options">
                    <button class="diff-btn easy" data-diff="EASY">🟢 EASY</button>
                    <button class="diff-btn normal active" data-diff="NORMAL">🟡 NORMAL</button>
                    <button class="diff-btn hard" data-diff="HARD">🔴 HARD</button>
                </div>
            </div>

            <div class="hud-controls">
                <button id="soundToggle" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">🔊</button>
                <button id="pauseBtn" class="icon-btn" title="Pause Game (P)" aria-label="Pause Game">⏸️</button>
            </div>
        </div>

        <div class="controls-hint">
            <div class="hint-tag"><span>Tap / Click / Space</span> Flap</div>
            <div class="hint-tag"><span>1-3</span> Difficulty</div>
            <div class="hint-tag"><span>P</span> Pause | <span>R</span> Restart | <span>M</span> Mute</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
